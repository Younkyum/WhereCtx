# WhereCtx on a NAS, exposed via Cloudflare Tunnel.
#
# - `wherectx` runs the prebuilt image from GHCR (no on-NAS build).
# - `cloudflared` is the tunnel; it reaches wherectx over the internal Docker
#   network at http://wherectx:8787. NO ports are published to the NAS/LAN, so
#   nothing is reachable except through the authenticated Cloudflare Tunnel.
#
# Put this file + a `.env` (see .env.nas.example) in a folder on the NAS
# (e.g. /volume1/docker/wherectx) and create a Container Manager Project from it.

services:
  wherectx:
    image: ghcr.io/younkyum/wherectx:latest
    restart: unless-stopped
    # Every setting comes from .env (see .env.nas.example); the value after
    # ":-" is what the server uses when .env leaves it out. PORT and HOST stay
    # at the image's 8787 and 0.0.0.0, the address cloudflared connects to.
    environment:
      DATABASE_URL: "sqlite:////data/wherectx.db"
      BASE_URL: "${BASE_URL}"
      # Every request arrives through the tunnel, so the client is the
      # cf-connecting-ip header; without it all clients would share the
      # cloudflared container's address in the rate limiters.
      TRUST_PROXY: "${TRUST_PROXY:-cloudflare}"
      USER_ID: "${USER_ID:-default}"
      ALLOW_MEMBER_WORKSPACES: "${ALLOW_MEMBER_WORKSPACES:-true}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      DEVICE_TOKEN: "${DEVICE_TOKEN:-}"
      AGENT_TOKEN: "${AGENT_TOKEN:-}"
      DEFAULT_AGENT_PRIVACY: "${DEFAULT_AGENT_PRIVACY:-coarse}"
      PRECISE_REQUIRES_REASON: "${PRECISE_REQUIRES_REASON:-true}"
      ALLOW_PRECISE_TO_AGENT: "${ALLOW_PRECISE_TO_AGENT:-false}"
      HIDE_HOME_EXACT_COORDINATES: "${HIDE_HOME_EXACT_COORDINATES:-true}"
      PROTECT_HOME_PLACE: "${PROTECT_HOME_PLACE:-true}"
      STALE_AFTER_SEC: "${STALE_AFTER_SEC:-900}"
      DEVICE_OFFLINE_AFTER_SEC: "${DEVICE_OFFLINE_AFTER_SEC:-86400}"
      RETENTION_HOURS: "${RETENTION_HOURS:-24}"
      STORE_RAW_HISTORY: "${STORE_RAW_HISTORY:-false}"
      NEAR_RADIUS_MULTIPLIER: "${NEAR_RADIUS_MULTIPLIER:-3}"
      WEBHOOK_ALLOW_PRIVATE_TARGETS: "${WEBHOOK_ALLOW_PRIVATE_TARGETS:-false}"
      WEBHOOK_ENCRYPTION_KEY: "${WEBHOOK_ENCRYPTION_KEY:-}"
      OAUTH_DYNAMIC_REGISTRATION: "${OAUTH_DYNAMIC_REGISTRATION:-false}"
      KAKAO_REST_API_KEY: "${KAKAO_REST_API_KEY:-}"
      NAVER_MAPS_CLIENT_ID: "${NAVER_MAPS_CLIENT_ID:-}"
      NAVER_MAPS_CLIENT_SECRET: "${NAVER_MAPS_CLIENT_SECRET:-}"
      GEO_OPERATOR_KEY_FOR_ALL: "${GEO_OPERATOR_KEY_FOR_ALL:-false}"
      EVENT_RETENTION_HOURS: "${EVENT_RETENTION_HOURS:-720}"
      SHARE_AUDIT_RETENTION_DAYS: "${SHARE_AUDIT_RETENTION_DAYS:-365}"
      ACCESS_LOG_RETENTION_DAYS: "${ACCESS_LOG_RETENTION_DAYS:-90}"
      INGEST_LOG_RETENTION_DAYS: "${INGEST_LOG_RETENTION_DAYS:-7}"
    volumes:
      # Named volume — Docker initializes it owned by the container's non-root
      # user (uid 10001), so no manual chown is needed.
      - wherectx-data:/data
    # No `ports:` on purpose — tunnel-only. To ALSO allow LAN access, uncomment:
    # ports:
    #   - "8787:8787"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Force the TCP-based http2 transport instead of the default QUIC (UDP).
    # On a NAS/home network the kernel UDP receive buffer is often too small
    # (cloudflared logs "failed to sufficiently increase receive buffer size"),
    # which makes QUIC connections periodically drop with
    # "timeout: no recent network activity" and fail in-flight requests — agents
    # then see intermittent "server unstable" errors. http2 avoids this entirely.
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: "${CF_TUNNEL_TOKEN}"
    depends_on:
      - wherectx

volumes:
  wherectx-data:
